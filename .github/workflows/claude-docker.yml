name: 🐳 Claude Docker

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lorenzomagnino/agents
          path: .agent-hub

      - name: Compose prompt
        run: |
          cat .agent-hub/.github/prompts/_global.md > /tmp/prompt.md
          cat .agent-hub/.github/prompts/agents/docker.md >> /tmp/prompt.md

      - name: Run Claude Docker Agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          max_turns: 20
          prompt_file: /tmp/prompt.md
