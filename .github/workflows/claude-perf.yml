name: ⚡ Claude Perf

on:
  workflow_call:
    inputs:
      target_file:
        description: 'Specific file to optimize (leave empty for full scan)'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  perf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lorenzomagnino/agents
          path: .agent-hub

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jax jaxlib numpy torch
          pip install -r requirements.txt || true

      - name: Detect CUDA availability
        id: cuda
        run: |
          python -c "import torch; print(torch.cuda.is_available())" | grep -q True \
            && echo "available=true" >> $GITHUB_OUTPUT \
            || echo "available=false" >> $GITHUB_OUTPUT

      - name: Compose prompt
        run: |
          cat .agent-hub/.github/prompts/_global.md > /tmp/prompt.md
          TARGET_FILE="${{ inputs.target_file || 'all files in /src/' }}" \
          CUDA_AVAILABLE="${{ steps.cuda.outputs.available }}" \
            envsubst < .agent-hub/.github/prompts/agents/perf.md >> /tmp/prompt.md

      - name: Read prompt
        id: read_prompt
        run: echo "content<<PROMPT_EOF" >> $GITHUB_OUTPUT && cat /tmp/prompt.md >> $GITHUB_OUTPUT && echo "PROMPT_EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Perf Agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: --max-turns 20
          prompt: ${{ steps.read_prompt.outputs.content }}

