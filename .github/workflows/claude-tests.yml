name: 🧪 Claude Tests

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lorenzomagnino/agents
          path: .agent-hub

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r requirements.txt || true

      - name: Compose prompt
        run: |
          cat .agent-hub/.github/prompts/_global.md > /tmp/prompt.md
          cat .agent-hub/.github/prompts/agents/tests.md >> /tmp/prompt.md

      - name: Read prompt
        id: read_prompt
        run: echo "content<<PROMPT_EOF" >> $GITHUB_OUTPUT && cat /tmp/prompt.md >> $GITHUB_OUTPUT && echo "PROMPT_EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Tests Agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: --max-turns 20
          prompt: ${{ steps.read_prompt.outputs.content }}

